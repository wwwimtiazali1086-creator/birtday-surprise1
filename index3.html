<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Mahnoor ??</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff5fa2,#ff9ecf,#8b5cf6,#38bdf8);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
position:relative;
}

@keyframes bgMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.container{

width:92%;
max-width:430px;
padding:25px;
border-radius:25px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
text-align:center;
color:white;
box-shadow:0 15px 35px rgba(0,0,0,.35);
z-index:10;

}

h1{

font-family:'Pacifico',cursive;
font-size:42px;
margin-bottom:15px;
animation:glow 2s infinite alternate;

}

@keyframes glow{

from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 35px gold;}

}

#typing{

min-height:70px;
font-size:18px;
line-height:30px;
margin-bottom:20px;

}

.cake{

position:relative;
width:220px;
height:220px;
margin:25px auto;

}

.leftCake,
.rightCake{

position:absolute;
width:110px;
height:180px;
bottom:0;
transition:1.4s;

}

.leftCake{

left:0;

}

.rightCake{

right:0;

}

.layer{

position:absolute;
left:0;
border-radius:12px;

}

.l1{

bottom:0;
width:110px;
height:60px;
background:#8B4513;

}

.l2{

bottom:55px;
width:95px;
height:55px;
left:8px;
background:#ffb347;

}

.l3{

bottom:105px;
width:75px;
height:50px;
left:18px;
background:#ff69b4;

}

.icing{

position:absolute;
bottom:150px;
left:18px;
width:75px;
height:12px;
background:white;
border-radius:20px;

}

.candle{

position:absolute;
left:50%;
transform:translateX(-50%);
bottom:175px;
width:12px;
height:40px;
background:white;

}

.flame{

position:absolute;
left:50%;
transform:translateX(-50%);
bottom:212px;
width:18px;
height:18px;
background:gold;
border-radius:50%;
animation:flicker .3s infinite alternate;

}

@keyframes flicker{

from{transform:translateX(-50%) scale(1);}
to{transform:translateX(-50%) scale(1.25);}

}

button{

margin-top:25px;
padding:15px 35px;
border:none;
border-radius:40px;
background:#ff0066;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

button:hover{

transform:scale(1.08);

}

#message{

display:none;
margin-top:25px;
font-size:21px;
animation:pop .8s;

}

@keyframes pop{

from{
opacity:0;
transform:scale(.5);
}

to{
opacity:1;
transform:scale(1);
}

}

.balloon{

position:absolute;
bottom:-150px;
width:60px;
height:80px;
border-radius:50%;
animation:floatUp linear infinite;

}

.balloon::after{

content:"";
position:absolute;
width:2px;
height:70px;
background:white;
left:29px;
top:80px;

}

@keyframes floatUp{

0%{
transform:translateY(0);
}

100%{
transform:translateY(-130vh);
}

}

.heart{

position:absolute;
font-size:24px;
animation:heartFloat linear forwards;

}

@keyframes heartFloat{

0%{
transform:translateY(0) scale(1);
opacity:1;
}

100%{
transform:translateY(-180px) scale(2);
opacity:0;
}

}

.star{

position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;

}

@keyframes twinkle{

50%{
opacity:.2;
transform:scale(2);
}

}

@media(max-width:600px){

h1{
font-size:34px;
}

#typing{
font-size:16px;
}

button{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Happy Birthday Mahnoor ??</h1>

<div id="typing"></div>

<div class="cake" id="cake">

<div class="leftCake" id="leftCake">

<div class="layer l1"></div>
<div class="layer l2"></div>
<div class="layer l3"></div>
<div class="icing"></div>

</div>

<div class="rightCake" id="rightCake">

<div class="layer l1"></div>
<div class="layer l2"></div>
<div class="layer l3"></div>
<div class="icing"></div>

</div>

<div class="candle"></div>

<div class="flame" id="flame"></div>

</div>

<button onclick="celebrate()">
?? Celebrate ??
</button>

<div id="message">

?? Cake Cut Successfully ??

<br><br>

Happy Birthday Mahnoor ??

<br><br>

May Allah bless you with happiness, success and endless smiles.

<br><br>

?? Forever Yours ??

<br>

<b>Ali</b>

</div>

</div>

<script>

const msg="Dear Mahnoor ?? Today is your special day. May every dream come true and every moment of your life be filled with happiness. You deserve the best birthday ever! ??";

let i=0;

function typing(){

if(i<msg.length){

document.getElementById("typing").innerHTML+=msg.charAt(i);

i++;

setTimeout(typing,45);

}

}

typing();
// ==========================
// Celebrate Function
// ==========================

function celebrate(){

document.getElementById("flame").style.display="none";

document.getElementById("leftCake").style.transform="translateX(-35px) rotate(-15deg)";

document.getElementById("rightCake").style.transform="translateX(35px) rotate(15deg)";

document.getElementById("message").style.display="block";

// Big Confetti

confetti({
particleCount:300,
spread:180,
origin:{y:0.6}
});

// Fireworks

for(let i=0;i<8;i++){

setTimeout(()=>{

confetti({

particleCount:180,
spread:360,
startVelocity:60,

origin:{
x:Math.random(),
y:Math.random()*0.6
}

});

},i*500);

}

}

// ==========================
// Side Confetti Every 3 sec
// ==========================

setInterval(()=>{

confetti({

particleCount:8,
angle:60,
spread:45,
origin:{x:0}

});

confetti({

particleCount:8,
angle:120,
spread:45,
origin:{x:1}

});

},3000);


// ==========================
// Floating Balloons
// ==========================

const colors=["red","blue","yellow","pink","green","orange","purple"];

for(let i=0;i<10;i++){

let b=document.createElement("div");

b.className="balloon";

b.style.left=Math.random()*100+"vw";

b.style.background=colors[Math.floor(Math.random()*colors.length)];

b.style.animationDuration=(8+Math.random()*5)+"s";

b.style.animationDelay=Math.random()*4+"s";

document.body.appendChild(b);

}


// ==========================
// Stars
// ==========================

for(let i=0;i<120;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*3+"s";

document.body.appendChild(s);

}


// ==========================
// Hearts On Click
// ==========================

document.body.addEventListener("click",function(e){

for(let i=0;i<8;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=["??","??","??","??"][Math.floor(Math.random()*4)];

h.style.left=(e.clientX+(Math.random()*80-40))+"px";

h.style.top=(e.clientY+(Math.random()*50-20))+"px";

h.style.animationDuration=(2+Math.random()*2)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},3000);

}

});


// ==========================
// Auto Hearts
// ==========================

setInterval(()=>{

let h=document.createElement("div");

h.className="heart";

h.innerHTML="??";

h.style.left=Math.random()*100+"vw";

h.style.top="95vh";

h.style.animationDuration="5s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},5000);

},900);


// ==========================
// Background Music
// ==========================

// ???? MP3 ???? ?? ??? "birthday.mp3" ?????
// ??? index.html ?? ???? ??? ????? ??? ??????

const music=new Audio("birthday.mp3");

music.loop=true;

document.body.addEventListener("click",()=>{

music.play().catch(()=>{});

},{once:true});

</script>

</body>
</html>
